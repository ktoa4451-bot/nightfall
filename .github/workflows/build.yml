
name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnose and extract project ZIP
        shell: bash
        run: |
          set -eo pipefail

          echo "=== Repository files ==="
          ls -la

          echo "=== Searching for ZIP ==="
          find . -maxdepth 4 -type f -iname '*.zip' -print

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP found in repository"
            exit 1
          fi

          echo "=== Selected ZIP: $ZIP_FILE ==="
          unzip -l "$ZIP_FILE" | head -n 80

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "=== Searching for Gradle project ==="
          BUILD_FILE="$(find extracted -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle found inside ZIP"
            find extracted -maxdepth 5 -type f -print | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle is missing"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "=== Project root after extraction ==="
          ls -la

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Nightfall
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

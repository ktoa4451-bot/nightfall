name: Nightfall ZIP Builder

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find and extract ZIP
    shell: bash
    run: |
      set -e
      mkdir -p extracted

      ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
        ! -path './.git/*' | head -n 1)"

      if [ -n "$ZIP_FILE" ]; then
        echo "Extracting: $ZIP_FILE"
        unzip -oq "$ZIP_FILE" -d extracted
      else
        echo "ZIP not found; checking existing project files."
        cp -a . extracted/project
      fi

  - name: Locate Gradle project
    id: project
    shell: bash
    run: |
      set -e

      BUILD_FILE="$(find extracted -type f \
        \( -name build.gradle -o -name build.gradle.kts \) \
        -not -path '*/.gradle/*' | head -n 1)"

      if [ -z "$BUILD_FILE" ]; then
        echo "::error::No build.gradle or build.gradle.kts found in ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$BUILD_FILE")"
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Found project: $PROJECT_DIR"

      if [ ! -f "$PROJECT_DIR/gradlew" ]; then
        echo "::error::Gradle Wrapper not found beside build.gradle."
        echo "Include gradlew, gradlew.bat and gradle/wrapper in the ZIP."
        exit 1
      fi

  - name: Build JAR
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      chmod +x ./gradlew
      ./gradlew --no-daemon clean build

  - name: Upload generated JAR
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client-JAR
      path: |
        extracted/**/build/libs/*.jar
      if-no-files-found: error
      retention-days: 14


name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'nightfall.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Nightfall
        shell: bash
        run: |
          if [ -f nightfall.zip ]; then
            mkdir extracted
            unzip -q nightfall.zip -d extracted
          else
            mkdir extracted
            cp -r . extracted/
          fi

      - name: Find Gradle project
        shell: bash
        run: |
          BUILD_FILE=$(find extracted -name build.gradle -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build Nightfall
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          

name: build-and-release

# Берёт ZIP с проектом из репозитория, распаковывает, собирает JAR
# и выкладывает его в Releases (это и есть "обнова": новый ZIP -> новый релиз).
# Если ZIP в репозитории нет, но есть build.gradle - собирает прямо из репо.

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Имя ZIP в корне репо (пусто = самый новый)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Find and unpack the ZIP
        id: unpack
        run: |
          ZIP="${{ github.event.inputs.zip_name }}"
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Unpacking $ZIP"
            rm -rf _src && mkdir _src
            unzip -q "$ZIP" -d _src
            GRADLE=$(find _src -maxdepth 3 -name build.gradle -not -path '*/node_modules/*' | head -n 1)
            [ -n "$GRADLE" ] || { echo "::error::build.gradle not found inside $ZIP"; exit 1; }
            PROJECT=$(dirname "$GRADLE")
            TAG=$(basename "$ZIP" .zip)
          else
            echo "No ZIP in repo, looking for build.gradle"
            GRADLE=$(find . -maxdepth 3 -name build.gradle | head -n 1)
            [ -n "$GRADLE" ] || { echo "::error::no ZIP and no build.gradle"; exit 1; }
            PROJECT=$(dirname "$GRADLE")
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT, tag: $TAG"

      - name: Logic tests
        working-directory: ${{ steps.unpack.outputs.project }}
        run: |
          if [ -f tools/run-tests.sh ]; then sh tools/run-tests.sh; else echo "no tests, skipping"; fi

      - name: Ghostline tests
        working-directory: ${{ steps.unpack.outputs.project }}
        continue-on-error: true
        run: |
          if [ -f tools/ghostline-run-tests.sh ]; then bash tools/ghostline-run-tests.sh; else echo "no ghostline tests, skipping"; fi

      - name: Build JAR
        working-directory: ${{ steps.unpack.outputs.project }}
        run: gradle build --stacktrace --no-daemon

      - name: Collect JAR
        id: jar
        run: |
          mkdir -p out
          cp ${{ steps.unpack.outputs.project }}/build/libs/*.jar out/
          rm -f out/*-sources.jar out/*-dev.jar
          ls -l out
          [ -n "$(ls out/*.jar 2>/dev/null)" ] || { echo "::error::no jar produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.unpack.outputs.tag }}-jar
          path: out/*.jar
          if-no-files-found: error

      - name: Publish release (update)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.unpack.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.jar --clobber
          else
            gh release create "$TAG" out/*.jar \
              --title "$TAG" \
              --notes "Автосборка из $TAG.zip (run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})" \
              --latest
          fi

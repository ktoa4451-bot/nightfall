
name: Nightfall ZIP to JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f nightfall.zip
          mkdir -p source
          unzip -oq nightfall.zip -d source

          BUILD_FILE="$(find source -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Loom
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [Path("build.gradle"), Path("build.gradle.kts")]:
              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")
              s = s.replace("1.11-SNAPSHOT", "1.11.8")
              s = re.sub(
                  r"(net\.fabricmc\.fabric-loom-remap['\"]\s*\)?\s*version\s*['\"])[^'\"]+",
                  r"\g<1>1.11.8",
                  s
              )
              p.write_text(s, encoding="utf-8")
              print(f"Updated {p}")

          if not Path("settings.gradle").exists() and \
             not Path("settings.gradle.kts").exists():
              Path("settings.gradle").write_text(
                  "pluginManagement {\n"
                  "    repositories {\n"
                  "        maven { url = "
                  "'https://maven.fabricmc.net/' }\n"
                  "        gradlePluginPortal()\n"
                  "        mavenCentral()\n"
                  "    }\n"
                  "}\n"
                  "rootProject.name = 'Nightfall'\n",
                  encoding="utf-8"
              )
          PY

          echo "===== BUILD FILE ====="
          ls -la
          sed -n '1,80p' build.gradle 2>/dev/null || true

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-diagnostics
          path: |
            source/**/build/reports/**
            source/**/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
          

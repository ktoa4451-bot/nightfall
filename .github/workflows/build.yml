
name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check ZIP
        shell: bash
        run: |
          test -f nightfall.zip || {
            echo "ERROR: nightfall.zip not found"
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q nightfall.zip -d extracted

          BUILD_FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"
          echo "Found: $BUILD_FILE"

      - name: Inspect and fix Loom version
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          if [ ! -f build.gradle ]; then
            echo "ERROR: Expected build.gradle was not found"
            exit 1
          fi

          echo "=== Original plugin declaration ==="
          nl -ba build.gradle | head -n 12

          sed -i -E \
            "/fabric-loom-remap/ s/1\.11(['\"])/1.11.8\1/g" \
            build.gradle

          echo "=== Updated plugin declaration ==="
          nl -ba build.gradle | head -n 12

          if grep -E "fabric-loom-remap.*version.*['\"]1\.11['\"]" build.gradle; then
            echo "ERROR: Loom version is still 1.11"
            exit 1
          fi

      - name: Build Nightfall
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          


name: Nightfall ZIP to JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract Nightfall ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f nightfall.zip
          mkdir -p source
          unzip -oq nightfall.zip -d source

          BUILD_FILE="$(find source -type f \
            -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Fabric Loom configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path("build.gradle")
          props = Path("gradle.properties")

          if not build.exists():
              raise SystemExit("ERROR: build.gradle missing")

          text = build.read_text(encoding="utf-8")

          # Loom 1.11 uses the legacy plugin ID.
          text = text.replace(
              "net.fabricmc.fabric-loom-remap",
              "fabric-loom"
          )

          # Use a fixed version instead of an unresolved property.
          pattern = (
              r"id\s+['\"]fabric-loom['\"]"
              r"\s+version\s+['\"][^'\"]+['\"]"
          )

          text, count = re.subn(
              pattern,
              "id 'fabric-loom' version '1.11.8'",
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not update Loom plugin declaration"
              )

          build.write_text(text, encoding="utf-8")

          if props.exists():
              ptext = props.read_text(encoding="utf-8")
              ptext = re.sub(
                  r"(?m)^loom_version=.*$",
                  "loom_version=1.11.8",
                  ptext
              )
              props.write_text(ptext, encoding="utf-8")

          settings = Path("settings.gradle")
          settings_kts = Path("settings.gradle.kts")

          if not settings.exists() and not settings_kts.exists():
              settings.write_text(
                  "pluginManagement {\n"
                  "    repositories {\n"
                  "        maven { url = "
                  "'https://maven.fabricmc.net/' }\n"
                  "        gradlePluginPortal()\n"
                  "        mavenCentral()\n"
                  "    }\n"
                  "}\n"
                  "rootProject.name = 'Nightfall'\n",
                  encoding="utf-8"
              )

          print("Fabric Loom configuration updated.")
          print(build.read_text(encoding="utf-8")[:500])
          PY

      - name: Build mod JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean build --stacktrace

      - name: Upload Nightfall JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-build-logs
          path: |
            source/**/build/reports/**
            source/**/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
          

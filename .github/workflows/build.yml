
name: Nightfall ZIP to JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f nightfall.zip
          mkdir -p source
          unzip -oq nightfall.zip -d source

          BUILD_FILE="$(find source -type f \
            -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update Loom configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "net.fabricmc.fabric-loom-remap",
              "net.fabricmc.fabric-loom-remap"
          )

          s = re.sub(
              r"(id\s+['\"]net\.fabricmc\.fabric-loom-remap['\"]"
              r"\s+version\s+)[\"'][^\"']+[\"']",
              r"\g<1>'1.15.5'",
              s
          )

          if "net.fabricmc.fabric-loom-remap" not in s:
              s = s.replace(
                  "id 'fabric-loom' version '${loom_version}'",
                  "id 'net.fabricmc.fabric-loom-remap' "
                  "version '1.15.5'"
              )

          if "1.15.5" not in s:
              raise SystemExit(
                  "ERROR: Could not set Loom version in build.gradle"
              )

          p.write_text(s, encoding="utf-8")

          props = Path("gradle.properties")
          if props.exists():
              t = props.read_text(encoding="utf-8")
              t = re.sub(
                  r"(?m)^loom_version=.*$",
                  "loom_version=1.15.5",
                  t
              )
              props.write_text(t, encoding="utf-8")

          print(p.read_text(encoding="utf-8")[:500])
          PY

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-diagnostics
          path: |
            source/**/build/reports/**
            source/**/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
          

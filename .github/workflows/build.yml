
name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Locate Nightfall project
        id: project
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f nightfall/build.gradle ] || [ -f nightfall/build.gradle.kts ]; then
            echo "dir=nightfall" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle build file not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Build Nightfall
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          

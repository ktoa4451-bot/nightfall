
name: Build Nightfall v10

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find or extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find "$1" -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit
          }

          SETTINGS="$(find_project . || true)"

          if [ -z "$SETTINGS" ]; then
            mkdir -p extracted
            ZIP="$(find . -type f -name '*.zip' \
              -not -path './extracted/*' -print -quit)"

            if [ -n "$ZIP" ]; then
              unzip -oq "$ZIP" -d extracted
              SETTINGS="$(find_project extracted || true)"
            fi
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Build file not found in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Nightfall
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v10
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

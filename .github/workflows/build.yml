
name: Nightfall Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        id: project
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/nightfall-project"

          if find . -type f -name build.gradle -not -path '*/build/*' | grep -q .; then
            echo "Project is already extracted."
            PROJECT="$(dirname "$(find . -type f -name build.gradle -not -path '*/build/*' | head -n 1)")"
          else
            ZIP=""
            while IFS= read -r file; do
              if unzip -Z1 "$file" 2>/dev/null | grep -qE '(^|/)build.gradle$'; then
                ZIP="$file"
                break
              fi
            done < <(find . -type f -iname '*.zip')

            if [ -z "$ZIP" ]; then
              echo "ERROR: No ZIP containing build.gradle was found."
              exit 1
            fi

            echo "Extracting: $ZIP"
            unzip -oq "$ZIP" -d "$RUNNER_TEMP/nightfall-project"

            PROJECT="$(dirname "$(find "$RUNNER_TEMP/nightfall-project" -type f -name build.gradle | head -n 1)")"
          fi

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: build.gradle not found after extraction."
            exit 1
          fi

          echo "Project directory: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build Nightfall
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          


name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract project
        run: |
          unzip -q nightfall.zip -d extracted
          test -f extracted/nightfall/build.gradle

      - name: Build mod
        working-directory: extracted/nightfall
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: extracted/nightfall/build/libs/*.jar
          if-no-files-found: error
          

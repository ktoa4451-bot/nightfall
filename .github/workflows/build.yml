
name: Nightfall v6 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Nightfall ZIP
        run: |
          mkdir -p extracted
          unzip -q nightfall-v6.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Gradle build file found in ZIP."
            echo "Check whether the archive contains source code."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $DIR"

      - name: Build Nightfall
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" \
            --no-daemon clean build --stacktrace

      - name: Upload Nightfall JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v6
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          

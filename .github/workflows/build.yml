
name: Nightfall Build

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall-with-build-yml.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Extract Nightfall project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="nightfall-with-build-yml.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found in repository root"
            ls -la
            exit 1
          }

          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP"
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Loom version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text(encoding="utf-8")

          pattern = (
              r"""id\s+['"](?:net\.fabricmc\.fabric-loom-remap|fabric-loom)['"]"""
              r"""\s+version\s+["'][^"']+["']"""
          )

          replacement = "id 'net.fabricmc.fabric-loom-remap' version '1.15.5'"
          s, count = re.subn(pattern, replacement, s, count=1)

          if count:
              p.write_text(s, encoding="utf-8")
              print("Updated Loom plugin to 1.15.5")
          else:
              print("Loom declaration not changed; checking existing configuration")

          props = Path("gradle.properties")
          if props.exists():
              s = props.read_text(encoding="utf-8")
              s = re.sub(r"(?m)^loom_version=.*$", "loom_version=1.15.5", s)
              props.write_text(s, encoding="utf-8")

          # Keep split client source-set configuration intact.
          print("Source-set configuration preserved.")
          PY

      - name: Patch Minecraft 1.21.11 API names
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("src/main/java"), Path("src/client/java")]

          for root in roots:
              if not root.exists():
                  continue

              for p in root.rglob("*.java"):
                  s = p.read_text(encoding="utf-8")
                  old = s

                  s = s.replace(
                      "import net.minecraft.resources.ResourceLocation;",
                      "import net.minecraft.resources.Identifier;"
                  )
                  s = s.replace(
                      "ResourceLocation.fromNamespaceAndPath",
                      "Identifier.fromNamespaceAndPath"
                  )

                  if p.name == "ClickGUI.java":
                      if (
                          "import net.minecraft.client.input.MouseButtonEvent;" not in s
                          and "import net.minecraft.client.gui.screens.Screen;" in s
                      ):
                          s = s.replace(
                              "import net.minecraft.client.gui.screens.Screen;",
                              "import net.minecraft.client.gui.screens.Screen;\n"
                              "import net.minecraft.client.input.MouseButtonEvent;"
                          )

                      s = re.sub(
                          r"public boolean mouseClicked\s*\(\s*double\s+mx\s*,"
                          r"\s*double\s+my\s*,\s*int\s+button\s*\)\s*\{",
                          "public boolean mouseClicked(MouseButtonEvent event, "
                          "boolean doubleClick) {\n"
                          "        double mx = event.x();\n"
                          "        double my = event.y();\n"
                          "        int button = event.button();",
                          s
                      )
                      s = s.replace(
                          "super.mouseClicked(mx, my, button)",
                          "super.mouseClicked(event, doubleClick)"
                      )

                  if s != old:
                      p.write_text(s, encoding="utf-8")
                      print("Patched:", p)
          PY

      - name: Build JAR and print diagnostics
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"

          gradle --no-daemon clean build \
            --stacktrace --console=plain > build.log 2>&1

          RESULT=$?

          echo "========== COMPILER ERRORS =========="
          grep -n -B 3 -A 5 -E \
            'error:|What went wrong:|Compilation failed|cannot find symbol|^[^ ]+\.java:[0-9]+:' \
            build.log | head -n 120 || true

          echo "========== LAST 100 LOG LINES =========="
          tail -n 100 build.log

          exit "$RESULT"

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          


name: Build Nightfall

on:
  workflow_dispatch:
  push:
    paths:
      - 'nightfall.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract Nightfall
        shell: bash
        run: |
          set -euo pipefail
          test -f nightfall.zip
          mkdir -p source
          unzip -oq nightfall.zip -d source

          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Fabric Loom version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          sed -i 's/1\.11-SNAPSHOT/1.11.8/g' build.gradle

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'Nightfall'
          EOF
          fi

          echo "=== Plugin configuration ==="
          head -n 15 build.gradle
          echo "=== Settings ==="
          cat settings.gradle 2>/dev/null || true

      - name: Build Nightfall
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Upload Nightfall JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          

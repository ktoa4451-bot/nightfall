name: Nightfall v6 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nightfall

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Run logic tests
        run: |
          if [ -f tools/run-tests.sh ]; then
            sh tools/run-tests.sh
          else
            echo "No optional logic tests found; skipping."
          fi

      - name: Build Nightfall
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v6
          path: |
            nightfall/build/libs/*.jar
            !nightfall/build/libs/*-sources.jar
            !nightfall/build/libs/*-dev.jar
          if-no-files-found: error

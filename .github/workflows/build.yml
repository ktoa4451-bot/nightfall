
name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check ZIP
        run: |
          if [ ! -f nightfall.zip ]; then
            echo "ERROR: nightfall.zip not found in repository root"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q nightfall.zip -d extracted
          find extracted -type f -name 'build.gradle*'
          BUILD_FILE=$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build Nightfall
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          

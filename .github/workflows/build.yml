name: Nightfall Build

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build
    shell: bash
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon build
      elif [ -f nightfall/gradlew ]; then
        cd nightfall
        chmod +x gradlew
        ./gradlew --no-daemon build
      elif [ -f build.gradle ]; then
        gradle --no-daemon build
      elif [ -f nightfall/build.gradle ]; then
        cd nightfall
        gradle --no-daemon build
      else
        echo "Gradle project not found"
        exit 1
      fi

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client
      path: '**/build/libs/*.jar'
      if-no-files-found: error

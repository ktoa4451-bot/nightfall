
name: Build Nightfall

on:
  workflow_dispatch:
  push:
    paths:
      - 'nightfall.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract Nightfall
        shell: bash
        run: |
          set -euo pipefail
          test -f nightfall.zip
          mkdir -p source
          unzip -q nightfall.zip -d source

          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in nightfall.zip"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure Fabric plugin repository
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github-placeholder
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          EOF

      - name: Build Nightfall
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'Nightfall'
          EOF
          fi

          gradle --no-daemon clean build --stacktrace

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-build-logs
          path: |
            source/**/build/reports/
            source/**/build/tmp/
          if-no-files-found: ignore

      - name: Upload Nightfall JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          


name: Nightfall Build

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "nightfall/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build Nightfall
        working-directory: nightfall
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: |
            nightfall/build/libs/*.jar
            !nightfall/build/libs/*-sources.jar
            !nightfall/build/libs/*-dev.jar
          if-no-files-found: error
          

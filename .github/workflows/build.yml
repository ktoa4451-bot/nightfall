name: Build from ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'source/**.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_PATH: source/nightfall.zip
  BUILD_DIR: ${{ github.workspace }}/_project

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP not found at $ZIP_PATH"
            ls -la source/ || true
            exit 1
          fi
          echo "Found: $ZIP_PATH"
          unzip -l "$ZIP_PATH" | head -n 40

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract ZIP
        run: |
          mkdir -p "$BUILD_DIR"
          unzip -q "$ZIP_PATH" -d "$BUILD_DIR"
          echo "=== Extracted top level ==="
          ls -la "$BUILD_DIR"

          # Если внутри ZIP есть единственная корневая папка — поднимаем её наверх
          ENTRIES=$(ls -1 "$BUILD_DIR" | wc -l)
          FIRST=$(ls -1 "$BUILD_DIR" | head -n 1)
          if [ "$ENTRIES" -eq 1 ] && [ -d "$BUILD_DIR/$FIRST" ]; then
            echo "Single root folder detected: $FIRST — flattening"
            shopt -s dotglob
            mv "$BUILD_DIR/$FIRST"/* "$BUILD_DIR"/
            shopt -u dotglob
            rmdir "$BUILD_DIR/$FIRST"
          fi

          echo "=== Project root ==="
          ls -la "$BUILD_DIR"

      - name: Validate build files
        run: |
          cd "$BUILD_DIR"
          for f in build.gradle settings.gradle gradle.properties; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in project root"
              ls -la
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Generate Gradle wrapper if missing
        run: |
          cd "$BUILD_DIR"
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found — generating wrapper"
            gradle wrapper --gradle-version 8.12
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build
        run: |
          cd "$BUILD_DIR"
          ./gradlew build --no-daemon --stacktrace

      - name: Collect JAR
        if: success()
        run: |
          cd "$BUILD_DIR"
          echo "=== build/libs ==="
          ls -la build/libs
          mkdir -p "$GITHUB_WORKSPACE/out"
          # только основной jar, без -sources и -dev
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          echo "=== Collected ==="
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: out/*.jar
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            _project/build/reports/**
            _project/build/tmp/**
          if-no-files-found: ignore

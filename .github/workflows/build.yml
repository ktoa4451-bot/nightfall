
name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - "!build-log.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Extract Nightfall project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -iname 'nightfall-with-build-yml.zip' \
            -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            unzip -oq "$ZIP_FILE" -d source
          fi

          PROJECT_DIR="$(find source . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './source/source/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Diagnose Java source files
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== JAVA FILES ====="
          find src -type f -name "*.java" -print | sort || true

          echo "===== REQUIRED CLASSES ====="
          for name in \
            ClickGUI \
            HudManager \
            WorldRenderer \
            MathUtil \
            AuraTargets \
            CrystalMath
          do
            echo "--- $name ---"
            find src -type f -name "$name.java" -print || true
          done

          echo "===== SOURCE SETS ====="
          find src -maxdepth 2 -type d -print | sort || true

      - name: Build Nightfall
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            BUILD_CMD=(./gradlew)
          else
            BUILD_CMD=(gradle)
          fi

          set +e
          "${BUILD_CMD[@]}" clean build --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          RESULT=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"
          exit "$RESULT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-build-log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled JAR
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-client
          path: |
            source/**/build/libs/*.jar
            source/build/libs/*.jar
            ./**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Report build result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            echo "BUILD SUCCESSFUL"
          else
            echo "BUILD FAILED"
            echo "Download nightfall-build-log to inspect the errors."
          fi
          

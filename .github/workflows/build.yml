
name: Build Nightfall v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Nightfall
        run: gradle build --no-daemon --stacktrace

      - name: Collect JAR
        shell: bash
        run: |
          mkdir -p output
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} output/ \;
          test -n "$(find output -name '*.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v10
          path: output/*.jar
          if-no-files-found: error
          retention-days: 14
          

name: Nightfall Client Build

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Find project
    run: |
      echo "Repository contents:"
      ls -la
      find . -maxdepth 3 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

  - name: Build Nightfall
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon build
      elif [ -f nightfall/gradlew ]; then
        cd nightfall
        chmod +x gradlew
        ./gradlew --no-daemon build
      else
        echo "ERROR: Gradle Wrapper not found."
        exit 1
      fi

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client
      path: '**/build/libs/*.jar'
      if-no-files-found: error

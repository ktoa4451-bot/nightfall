name: Build Nightfall Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Loom 1.11 требует Gradle 8.14+
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract ZIP
        run: |
          if [ ! -f "nightfall.zip" ]; then
            echo "::error::Файл nightfall.zip не найден в корне репозитория!"
            exit 1
          fi
          
          mkdir -p build_dir
          unzip -q nightfall.zip -d build_dir
          
          # Если внутри архива есть одна корневая папка, поднимаем её содержимое на уровень выше
          COUNT=$(ls -1 build_dir | wc -l)
          FIRST=$(ls -1 build_dir | head -n 1)
          if [ "$COUNT" -eq 1 ] && [ -d "build_dir/$FIRST" ]; then
            echo "Обнаружена корневая папка '$FIRST', перемещаем содержимое..."
            shopt -s dotglob
            mv build_dir/$FIRST/* build_dir/
            shopt -u dotglob
            rmdir build_dir/$FIRST
          fi
          
          echo "Содержимое build_dir:"
          ls -la build_dir

      - name: Ensure settings.gradle in root
        run: |
          cd build_dir
          if [ ! -f "settings.gradle" ]; then
            echo "settings.gradle не найден в корне, ищем..."
            FOUND=$(find . -name "settings.gradle" -type f | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::settings.gradle отсутствует в архиве!"
              exit 1
            fi
            cp "$FOUND" ./settings.gradle
            echo "Скопирован из $FOUND"
          else
            echo "settings.gradle уже в корне."
          fi
          echo "=== settings.gradle ==="
          cat settings.gradle

      - name: Generate Gradle Wrapper
        run: |
          cd build_dir
          if [ ! -f "./gradlew" ]; then
            echo "gradlew не найден, генерируем..."
            gradle wrapper --gradle-version 8.14
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build with Gradle
        run: |
          cd build_dir
          ./gradlew build --no-daemon --stacktrace --refresh-dependencies

      - name: Collect JAR
        if: success()
        run: |
          cd build_dir
          mkdir -p ../output
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} ../output/ \;
          echo "Скопировано в output:"
          ls -la ../output

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: output/*.jar
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build_dir/build/reports/**
            build_dir/build/tmp/**
          if-no-files-found: ignore


name: Build Nightfall v10

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate or extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find "$1" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          SETTINGS="$(find_settings . || true)"

          if [ -z "$SETTINGS" ]; then
            ZIP="$(find . -type f -name '*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/extracted/*' \
              -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "ERROR: Gradle project or ZIP not found."
              find . -maxdepth 3 -type f | head -200
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
            SETTINGS="$(find_settings extracted || true)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$DIR/build.gradle" ] && \
             [ ! -f "$DIR/build.gradle.kts" ]; then
            echo "ERROR: build.gradle not found in $DIR"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $DIR"

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Nightfall
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Show build outputs
        if: success()
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -type f -name '*.jar'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v10
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

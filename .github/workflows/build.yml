name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check ZIP
        run: |
          test -f nightfall.zip || {
            echo "ERROR: nightfall.zip not found"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q nightfall.zip -d extracted
          BUILD_FILE=$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Fix Loom version for this build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if grep -q "version: '1.11'" build.gradle; then
            sed -i "s/version: '1\.11'/version: '1.11.8'/" build.gradle
          elif grep -q 'version: "1.11"' build.gradle; then
            sed -i 's/version: "1\.11"/version: "1.11.8"/' build.gradle
          fi
          echo "Plugin declaration:"
          grep -n -A2 -B2 "fabric-loom-remap" build.gradle

      - name: Build Nightfall
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          

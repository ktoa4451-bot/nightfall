
name: Build Nightfall v10

on:
  workflow_dispatch:
  push:
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.properties'
      - 'nightfall-ghostline/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          for dir in . nightfall-ghostline; do
            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Gradle settings file not found"
          find . -maxdepth 4 \
            \( -name settings.gradle -o -name settings.gradle.kts \)
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build project
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v10
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

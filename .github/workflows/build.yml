
name: Nightfall ZIP to JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "nightfall.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f nightfall.zip
          mkdir -p source
          unzip -oq nightfall.zip -d source

          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Loom and source sets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text(encoding="utf-8")

          # Use the published Loom plugin.
          pattern = (
              r"""id\s+['"](?:net\.fabricmc\.fabric-loom-remap|fabric-loom)['"]"""
              r"""\s+version\s+["'][^"']+["']"""
          )
          s, count = re.subn(
              pattern,
              "id 'net.fabricmc.fabric-loom-remap' version '1.15.5'",
              s,
              count=1
          )
          if count == 0:
              raise SystemExit("ERROR: Loom plugin declaration not found")

          # Sources currently live in src/main/java and use client classes.
          s = re.sub(
              r"(?m)^\s*splitEnvironmentSourceSets\(\)\s*\n",
              "",
              s
          )
          s = re.sub(
              r"(?m)^\s*sourceSet\s+sourceSets\.client\s*\n",
              "",
              s
          )

          p.write_text(s, encoding="utf-8")

          props = Path("gradle.properties")
          if props.exists():
              t = props.read_text(encoding="utf-8")
              t = re.sub(
                  r"(?m)^loom_version=.*$",
                  "loom_version=1.15.5",
                  t
              )
              props.write_text(t, encoding="utf-8")

          print("Loom and source-set configuration updated.")
          print(p.read_text(encoding="utf-8")[:1200])
          PY

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-build-logs
          path: |
            source/**/build/reports/**
            source/**/build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
          

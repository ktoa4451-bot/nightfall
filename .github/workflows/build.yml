
name: Nightfall Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          FILE=$(find . -type f -name build.gradle -not -path '*/build/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: build.gradle not found. Check whether the ZIP was extracted into the repository."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build Nightfall
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
          if-no-files-found: error
          

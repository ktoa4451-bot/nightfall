name: Nightfall Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find . -type f -name build.gradle \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            ZIP="$(find . -type f -iname '*.zip' \
              -not -path '*/.git/*' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::No build.gradle or project ZIP found"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nightfall-project"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/nightfall-project"

            PROJECT="$(find "$RUNNER_TEMP/nightfall-project" \
              -type f -name build.gradle -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::ZIP does not contain build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$(realpath "$PROJECT")" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Fabric-1.21.11
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

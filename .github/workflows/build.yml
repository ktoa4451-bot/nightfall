
name: Nightfall v6 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          FILE=$(find . -maxdepth 5 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: build.gradle or build.gradle.kts not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in: $DIR"

      - name: Build Nightfall
        run: gradle -p "${{ steps.project.outputs.dir }}" --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-v6
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          

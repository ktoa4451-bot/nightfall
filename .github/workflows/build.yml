
name: Nightfall ZIP Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository"
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            ! -path '*/.gradle/*' | head -n 1 || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle was not found in the ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle was not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Nightfall
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client-JAR
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

name: Nightfall ZIP Builder

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install Gradle 9.2.0
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.0'

  - name: Find and extract Nightfall ZIP
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p extracted

      ZIP_FILE=$(find . -maxdepth 3 -type f \
        -iname '*.zip' \
        ! -path './.git/*' | head -n 1)

      if [ -n "$ZIP_FILE" ]; then
        echo "ZIP found: $ZIP_FILE"
        unzip -oq "$ZIP_FILE" -d extracted
      else
        echo "No ZIP found. Checking repository files."
        cp -a . extracted/
      fi

  - name: Find Gradle project
    id: locate
    shell: bash
    run: |
      set -euo pipefail

      BUILD_FILE=$(find extracted -type f \
        \( -name build.gradle -o -name build.gradle.kts \) \
        ! -path '*/.gradle/*' | head -n 1)

      if [ -z "$BUILD_FILE" ]; then
        echo "::error::build.gradle not found!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$BUILD_FILE")

      echo "Project: $PROJECT_DIR"
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
         [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
        echo "::error::settings.gradle not found!"
        exit 1
      fi

  - name: Check project files
    working-directory: ${{ steps.locate.outputs.dir }}
    shell: bash
    run: |
      set -e

      test -f build.gradle -o -f build.gradle.kts
      test -f gradle.properties
      test -f settings.gradle -o -f settings.gradle.kts
      test -f src/main/resources/fabric.mod.json

      echo "Nightfall project structure verified."

  - name: Build Nightfall
    working-directory: ${{ steps.locate.outputs.dir }}
    run: gradle --no-daemon clean build --stacktrace

  - name: Upload Nightfall JAR
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client-JAR
      path: |
        ${{ steps.locate.outputs.dir }}/build/libs/*.jar
        !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar
        !${{ steps.locate.outputs.dir }}/build/libs/*-dev.jar
      if-no-files-found: error
      retention-days: 14

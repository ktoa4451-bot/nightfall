name: Nightfall Client Build

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Extract project ZIP if needed
    shell: bash
    run: |
      if [ -f "nightfall-with-build-yml.zip" ]; then
        mkdir -p source
        unzip -oq "nightfall-with-build-yml.zip" -d source
      fi

  - name: Locate Gradle project
    id: project
    shell: bash
    run: |
      PROJECT_DIR=""
      for file in build.gradle build.gradle.kts; do
        if [ -f "$file" ]; then
          PROJECT_DIR="."
          break
        fi
      done

      if [ -z "$PROJECT_DIR" ]; then
        for file in $(find source -type f \( -name build.gradle -o -name build.gradle.kts \)); do
          PROJECT_DIR="$(dirname "$file")"
          break
        done
      fi

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Gradle build file not found."
        exit 1
      fi

      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Project directory: $PROJECT_DIR"

  - name: Build JAR
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew --no-daemon build
      else
        echo "ERROR: gradlew is missing. Include the Gradle wrapper in the project ZIP."
        exit 1
      fi

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client-JAR
      path: |
        source/**/build/libs/*.jar
        build/libs/*.jar
      if-no-files-found: error
      retention-days: 14

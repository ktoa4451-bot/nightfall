- name: Show project structure
    run: |
      pwd
      ls -la
      find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \)

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Nightfall Client
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon build
      elif [ -f nightfall/gradlew ]; then
        cd nightfall
        chmod +x gradlew
        ./gradlew --no-daemon build
      else
        echo "Gradle Wrapper not found"
        exit 1
      fi

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Nightfall-Client
      path: |
        **/build/libs/*.jar
      if-no-files-found: error


name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -eo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "=== Gradle files found ==="
          find extracted -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'gradle.properties' \
          \) -print

          BUILD_FILE="$(find extracted -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' \
          \) -print -quit)"

          SETTINGS_FILE="$(find extracted -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -z "$BUILD_FILE" ] || [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: build.gradle or settings.gradle is missing"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          SETTINGS_DIR="$(dirname "$SETTINGS_FILE")"

          if [ "$PROJECT_DIR" != "$SETTINGS_DIR" ]; then
            echo "ERROR: Gradle files are in different directories"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "=== Root files ==="
          ls -la

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

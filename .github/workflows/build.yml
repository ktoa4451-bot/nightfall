
name: Nightfall Client Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check ZIP
        shell: bash
        run: |
          if [ ! -f nightfall.zip ]; then
            echo "ERROR: nightfall.zip not found in repository root"
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q nightfall.zip -d extracted

          BUILD_FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found in nightfall.zip"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "Build file: $BUILD_FILE"

      - name: Fix Fabric Loom version
        shell: bash
        working-directory: extracted
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          if [ -f build.gradle ]; then
            sed -i -E \
              "/net\.fabricmc\.fabric-loom-remap/ s/1\.11(['\"])/1.11.8\1/g" \
              build.gradle
            echo "Updated plugin declaration:"
            grep -n "fabric-loom-remap" build.gradle || true
          else
            echo "ERROR: build.gradle not found"
            exit 1
          fi

      - name: Verify Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Java version:"
          java -version
          echo "Gradle project:"
          gradle --version
          echo "Project files:"
          ls -la

      - name: Build Nightfall
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          

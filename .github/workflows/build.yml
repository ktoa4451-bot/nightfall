name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # the project has no gradle wrapper, so Gradle is installed here (Loom 1.14 needs Gradle 9.x)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Logic tests (pure Java, no Minecraft)
        run: sh tools/run-tests.sh

      - name: Build
        run: gradle build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: nightfall
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Upload the sources jar
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-sources
          path: build/libs/*-sources.jar
          if-no-files-found: ignore

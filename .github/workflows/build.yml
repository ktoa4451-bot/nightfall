
name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Nightfall ZIP
        shell: bash
        run: |
          set -eo pipefail

          echo "=== Repository ==="
          ls -la

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "Project directory: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "Creating settings.gradle"
            printf "rootProject.name = 'nightfall'\n" > settings.gradle
          fi

          echo "=== Gradle files ==="
          ls -la
          test -d src || {
            echo "ERROR: src directory is missing"
            exit 1
          }

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Nightfall
        run: gradle --no-daemon clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

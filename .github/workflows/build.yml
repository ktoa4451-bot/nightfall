
name: Nightfall Client Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cp -a "$PROJECT_DIR"/. .
          test -f settings.gradle -o -f settings.gradle.kts

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Nightfall
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
